name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja

      # Windows has no packaged SDL2, so CMake downloads and builds it.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Play the bundled open content for a few seconds without a window:
      # walk into the goblin camp's cave entrance, which loads the cave.
      - name: Smoke test with the open content
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/shadowflare --data content --at 864,3072 --walk 0,-96 --ticks 60 2>&1 | tee run.log
          grep -q 'Going to Scenario/00000002 "Goblin Cave"' run.log
