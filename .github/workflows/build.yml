name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja

      # Windows has no packaged SDL2, so CMake downloads and builds it.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Play the bundled open content for a few seconds without a window:
      # walk into the meadow's stairs down, which loads the waterworks.
      - name: Smoke test with the open content
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/shadowflare --data content --map meadow --at -792,1872 --walk 90,-60 --ticks 60 2>&1 | tee run.log
          grep -q 'Going to Scenario/00000002 "Old Waterworks"' run.log
          # A new game begins in Remote Town, as the original's does.
          ./build/shadowflare --data content --ticks 3 2>&1 | tee start.log
          grep -q 'Going to Scenario/10000000 "Remote Town", entry 0' start.log
          # Cast each spell that has effects: every effect has its animation.
          for spell in 1 2 3 4 5 10 11 12 13 15 16 21; do
            ./build/shadowflare --data content --no-menu --spell $spell:20 --cast 1:200,60 --ticks 80 2>&1 | tee -a spells.log
          done
          ! grep -q 'No animation for effect' spells.log
